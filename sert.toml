# sert, the shared test toolkit (github.com/kohltastrophe/sert): `python3 tools/sert.py <command>`.
#
#   fetch                       the pinned sert package and luau into .sert/ (gitignored)
#   run [-a ARGS]               the headless suite ([test].entries; ARGS go to test/spec.client.luau)
#   studio [--suite core]       the suite in a fresh, unattended Studio
#   lint / mutate               static checks, compile-time type tests, and mutation testing
#   coverage --min 90           line coverage after `run --coverage`
#   release check-version --package flux [--tag TAG]
#   dist --from REV             the released tree onto the dist branch
#
# Work against a sert checkout: put `[override] sert = "../sert"` in sert.local.toml (gitignored).

[sert]
version = "0.1.0"

[tools]
luau = "0.724"

[test]
entries = ["test/spec.client.luau"]

[coverage]
min = 90
include = ["src"]

[mutate]
min = 85
include = ["src"]
exclude = ["src/Type"]

[mutate.specs]
"src/Async.luau" = "@file=Async"
"src/Bind.luau" = "@file=Bind,Edit"
"src/Clock.luau" = "@file=Clock,Async,Motion"
"src/Compat.luau" = "@file=Clock,Motion,Edit"
"src/Conditional.luau" = "@file=Conditional"
"src/Edit.luau" = "@file=Edit,Bind"
"src/Graph.luau" = "@file=Graph,Store,Conditional"
"src/Interact.luau" = "@file=Interact"
"src/Layout.luau" = "@file=Layout"
"src/Motion.luau" = "@file=Motion"
"src/Responsive.luau" = "@file=Responsive"
"src/Store.luau" = "@file=Store"
"src/Sync.luau" = "@file=Sync"
"src/init.luau" = "@file=Init,Edit,Bind"

[lint]
paths = ["src", "test"]
solvers = ["new"]
registration = { aggregator = "test/unit/init.luau", specs = "test/unit/**/*.spec.luau" }

[types]
pass = ["test/types"]
fail = ["test/types/fail"]

[release.packages.flux]
prefix = "v"
versions = [{ file = "wally.toml", key = "package.version" }]

[dist]
paths = ["default.project.json", "src"]
branch = "dist"
name = "Flux"
package = "flux"

[cloud]
project = "test/default.project.json"
script = "test/spec.client.luau"

[studio]
out = "build/sert"
runner = "ReplicatedStorage/sert/roblox/Runner"

[studio.suites.core]
mode = "play"
project = "test/default.project.json"
config = "ReplicatedStorage/Flux.Tests"
specs = ["test/unit/**/*.spec.luau"]
timeout = 300
