# sert, the shared test toolkit (github.com/kohltastrophe/sert): `python3 tools/sert.py <command>`.
#
#   fetch                       the pinned sert package into .sert/ (gitignored) and sert.lock
#   run                         the headless suite ([test].specs)
#   studio [--check]            the suite in a fresh, unattended Studio
#   cloud                       the suite on Roblox Open Cloud Luau Execution
#   lint / mutate               static checks, compile-time type tests, and mutation testing
#   coverage [--min 90]         line coverage after `run --coverage`
#
# Work against a sert checkout: put `[override] sert = "../sert"` in sert.local.toml (gitignored).

[sert]
version = "0.2.0"

[test]
specs = ["test/**/*.spec.luau"]
setup = "test/setup.luau"
codegen = false

[coverage]
min = 90
include = ["src"]

[mutate]
min = 85
include = ["src"]
exclude = ["src/Type"]

[lint]
paths = ["src", "test"]
solvers = ["new"]

[types]
pass = ["test/types"]
fail = ["test/types/fail"]

[release]
prefix = "v"
versions = [
	{ file = "wally.toml", key = "package.version" },
	{ file = ".luaudocs/guide/introduction/getting-started.md", pattern = 'Flux = "kohltastrophe/flux@([^"]+)"' },
]

[cloud]
project = "test/default.project.json"
specs = ["test/**/*.spec.luau"]

[studio]
out = "build/sert"
project = "test/default.project.json"
mode = "play"
specs = ["test/**/*.spec.luau"]
timeout = 300
