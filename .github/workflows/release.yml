# Release Flux. kohltastrophe/release keeps a release PR open on main that bumps wally.toml and guide versions;
# merging it tags v<version>, builds the .rbxm files, creates the GitHub release, updates the `dist` branch,
# and publishes to Wally and the Creator Store.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and package only; no GitHub release, no Wally or Creator Store publish
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN || github.token }}

      - name: Release PR or Release
        id: release
        uses: kohltastrophe/release@v1.0.0
        with:
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN || github.token }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        if: steps.release.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
        with:
          version: v1.2.0

      - name: Wait for CI
        if: steps.release.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          empty=0
          api_errors=0
          while true; do
            if ! RESULT=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '.workflow_runs | sort_by(.run_number) | last | "\(.status // "none") \(.conclusion // "none")"'); then
              api_errors=$((api_errors + 1))
              if [ "$api_errors" -ge 8 ]; then
                echo "::error::Failed to query CI workflow status after $api_errors consecutive gh api errors"
                exit 1
              fi
              echo "gh api error ($api_errors/8); retrying in 15s..."
              sleep 15
              continue
            fi
            api_errors=0
            STATUS="${RESULT%% *}"
            CONCLUSION="${RESULT##* }"
            echo "CI status=$STATUS conclusion=$CONCLUSION"
            if [ "$STATUS" = "completed" ]; then
              [ "$CONCLUSION" = "success" ] && exit 0
              echo "::error::CI concluded '$CONCLUSION' for $GITHUB_SHA"
              exit 1
            elif [ "$STATUS" = "none" ]; then
              empty=$((empty + 1))
              if [ "$empty" -ge 8 ]; then
                echo "::error::No CI workflow run found for $GITHUB_SHA after 2 minutes"
                exit 1
              fi
            else
              empty=0
            fi
            echo "CI not finished yet; waiting 15s..."
            sleep 15
          done

      - name: Build the release assets
        if: steps.release.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p dist
          rojo build default.project.json --output dist/Flux.rbxm
          rojo build .github/model.project.json --output dist/Flux-Model.rbxm
          wally package --list
          wally package --output "$RUNNER_TEMP/wally.zip"
          size=$(stat -c %s "$RUNNER_TEMP/wally.zip")
          echo "Wally package: $size bytes (the registry refuses more than 2 MiB)"
          [ "$size" -le 2097152 ]
          cp "$RUNNER_TEMP/wally.zip" "dist/Flux-$VERSION-package.zip"
          (cd dist && sha256sum Flux.rbxm "Flux-$VERSION-package.zip" > SHA256SUMS)
          { echo '```'; cat dist/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.release.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
        with:
          name: release
          path: dist/
          if-no-files-found: error
          overwrite: true

      - name: Create GitHub release
        if: steps.release.outputs.should_release == 'true'
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          NOTES_FILE: ${{ steps.release.outputs.notes_file }}
        run: |
          sha256sum --check --strict SHA256SUMS
          assets=(Flux.rbxm "Flux-$VERSION-package.zip" SHA256SUMS)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "Flux $VERSION" --notes-file "$NOTES_FILE"
          elif [ "$PRERELEASE" = true ]; then
            gh release create "$TAG" "${assets[@]}" --target "$GITHUB_SHA" --title "Flux $VERSION" --notes-file "$NOTES_FILE" --prerelease
          else
            gh release create "$TAG" "${assets[@]}" --target "$GITHUB_SHA" --title "Flux $VERSION" --notes-file "$NOTES_FILE"
          fi

      # The `dist` branch: one commit per release holding only the shipped tree, for consumers that vendor by git
      # (subtree, submodule) rather than through Wally. `sert dist` builds the commit with plumbing on top of the
      # previous dist tip and never touches the working tree (sert.toml [dist]; versioned by [release]).
      - name: Update dist branch
        if: steps.release.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin dist > /dev/null; then
            git fetch --no-tags origin dist:dist
          fi
          python3 tools/sert.py dist --from "$GITHUB_SHA"
          git log -1 --format='%H %s' dist
          git push origin dist

      - name: Publish kohltastrophe/flux to Wally
        if: steps.release.outputs.should_release == 'true'
        env:
          WALLY_AUTH_TOKEN: ${{ secrets.WALLY_AUTH_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ -z "$WALLY_AUTH_TOKEN" ]; then echo "::notice::No WALLY_AUTH_TOKEN secret: Wally publish skipped"; exit 0; fi
          wally login --token "$WALLY_AUTH_TOKEN"
          # `wally publish` exits 0 even when the registry refuses the package, so read what it printed.
          output=$(wally publish 2>&1) || { echo "$output"; exit 1; }
          echo "$output"
          case "$output" in
            *"published successfully"*) ;;
            *"already exists"*) echo "::notice::kohltastrophe/flux@$VERSION was already on Wally" ;;
            *) echo "::error::Wally did not accept kohltastrophe/flux@$VERSION"; exit 1 ;;
          esac

      # Uploading the same model again only adds an asset version, so a re-run is safe.
      - name: Update the Flux model on the Creator Store
        if: steps.release.outputs.should_release == 'true'
        env:
          MODEL_TOKEN: ${{ secrets.MODEL_TOKEN }}
          MODEL_ASSET_ID: 18506925834
        run: |
          if [ -z "$MODEL_TOKEN" ]; then echo "::notice::No MODEL_TOKEN secret: Creator Store publish skipped"; exit 0; fi
          curl --fail-with-body -sS -X PATCH \
            "https://apis.roblox.com/assets/v1/assets/$MODEL_ASSET_ID" \
            -H "x-api-key: $MODEL_TOKEN" \
            -F 'request={"assetId":"'"$MODEL_ASSET_ID"'"};type=application/json' \
            -F "fileContent=@dist/Flux-Model.rbxm;type=model/x-rbxm"
