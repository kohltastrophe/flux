# Release Flux. kohltastrophe/release keeps a release PR open on main that bumps wally.toml and guide versions;
# merging it tags v<version>, builds the .rbxm files, creates the GitHub release, updates the `dist` branch,
# and publishes to Wally and the Creator Store.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and package only; no GitHub release, no Wally or Creator Store publish
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      release: ${{ steps.release.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN || github.token }}

      - name: Release PR or Release
        id: release
        uses: kohltastrophe/release@v1.0.0
        with:
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN || github.token }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

  ci:
    name: Wait for CI
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
    steps:
      - name: Wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while true; do
            RESULT=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '.workflow_runs | sort_by(.run_number) | last | "\(.status // "none") \(.conclusion // "none")"') || RESULT="none none"
            STATUS="${RESULT%% *}"
            CONCLUSION="${RESULT##* }"
            echo "CI status=$STATUS conclusion=$CONCLUSION"
            if [ "$STATUS" = "completed" ]; then
              [ "$CONCLUSION" = "success" ] && exit 0
              echo "::error::CI concluded '$CONCLUSION' for $GITHUB_SHA"
              exit 1
            fi
            echo "CI not finished yet; waiting 15s..."
            sleep 15
          done

  package:
    name: Package
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rojo builds the .rbxm files; wally packages the library. Versions are pinned in rokit.toml.
      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0

      - name: Build the release assets
        run: |
          mkdir -p dist
          rojo build default.project.json --output dist/Flux.rbxm
          rojo build .github/model.project.json --output dist/Flux-Model.rbxm

      - name: Check the Wally package
        run: |
          wally package --list
          wally package --output "$RUNNER_TEMP/wally.zip"
          size=$(stat -c %s "$RUNNER_TEMP/wally.zip")
          echo "Wally package: $size bytes (the registry refuses more than 2 MiB)"
          [ "$size" -le 2097152 ]

      # The Wally package is also a release asset, so sert.toml [deps] can pin it by digest without the registry.
      - name: Add the package zip and SHA256SUMS
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cp "$RUNNER_TEMP/wally.zip" "dist/Flux-$VERSION-package.zip"
          (cd dist && sha256sum Flux.rbxm "Flux-$VERSION-package.zip" > SHA256SUMS)
          { echo '```'; cat dist/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist/
          if-no-files-found: error
          overwrite: true

  release:
    name: GitHub release
    needs: [version, ci, package]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release notes
        id: notes
        uses: kohltastrophe/release@v1.0.0
        with:
          mode: release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist

      - name: Create the release (a re-run refreshes its assets)
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          sha256sum --check --strict SHA256SUMS
          assets=(Flux.rbxm "Flux-$VERSION-package.zip" SHA256SUMS)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "Flux $VERSION" --notes-file "$NOTES_FILE"
          elif [ "$PRERELEASE" = true ]; then
            gh release create "$TAG" "${assets[@]}" --target "$GITHUB_SHA" --title "Flux $VERSION" --notes-file "$NOTES_FILE" --prerelease
          else
            gh release create "$TAG" "${assets[@]}" --target "$GITHUB_SHA" --title "Flux $VERSION" --notes-file "$NOTES_FILE"
          fi

  # The `dist` branch: one commit per release holding only the shipped tree, for consumers that vendor by git
  # (subtree, submodule) rather than through Wally. `sert dist` builds the commit with plumbing on top of the previous
  # dist tip and never touches the working tree (sert.toml [dist]; versioned by [release]).
  dist:
    name: Dist branch
    needs: [version, release]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dist
      cancel-in-progress: false
    steps:
      # Credentials stay in this job only: it pushes the dist branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Commit the release onto dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin dist > /dev/null; then
            git fetch --no-tags origin dist:dist
          fi
          python3 tools/sert.py dist --from "$GITHUB_SHA"
          git log -1 --format='%H %s' dist

      - name: Push dist
        run: git push origin dist

  wally:
    name: Publish to Wally
    needs: [version, release]
    if: needs.version.outputs.release == 'true'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0

      - name: Publish kohltastrophe/flux
        env:
          WALLY_AUTH_TOKEN: ${{ secrets.WALLY_AUTH_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$WALLY_AUTH_TOKEN" ]; then echo "::notice::No WALLY_AUTH_TOKEN secret: Wally publish skipped"; exit 0; fi
          wally login --token "$WALLY_AUTH_TOKEN"
          # `wally publish` exits 0 even when the registry refuses the package, so read what it printed.
          output=$(wally publish 2>&1) || { echo "$output"; exit 1; }
          echo "$output"
          case "$output" in
            *"published successfully"*) ;;
            *"already exists"*) echo "::notice::kohltastrophe/flux@$VERSION was already on Wally" ;;
            *) echo "::error::Wally did not accept kohltastrophe/flux@$VERSION"; exit 1 ;;
          esac

  creator-store:
    name: Publish to the Creator Store
    needs: [version, release]
    if: needs.version.outputs.release == 'true'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist

      # Uploading the same model again only adds an asset version, so a re-run is safe.
      - name: Update the Flux model
        env:
          MODEL_TOKEN: ${{ secrets.MODEL_TOKEN }}
          MODEL_ASSET_ID: 18506925834
        run: |
          if [ -z "$MODEL_TOKEN" ]; then echo "::notice::No MODEL_TOKEN secret: Creator Store publish skipped"; exit 0; fi
          curl --fail-with-body -sS -X PATCH \
            "https://apis.roblox.com/assets/v1/assets/$MODEL_ASSET_ID" \
            -H "x-api-key: $MODEL_TOKEN" \
            -F 'request={"assetId":"'"$MODEL_ASSET_ID"'"};type=application/json' \
            -F "fileContent=@dist/Flux-Model.rbxm;type=model/x-rbxm"
