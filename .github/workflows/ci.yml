name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "ci-${{ github.ref }}-${{ startsWith(github.event.head_commit.message, 'chore: release') && github.sha || '' }}"
  cancel-in-progress: "${{ !startsWith(github.event.head_commit.message, 'chore: release') }}"

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Lint, Test, Coverage & Mutation
    runs-on: ubuntu-latest
    environment: testing
    timeout-minutes: 30
    concurrency:
      group: luau-execution
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Conventional Commits and version check
        uses: kohltastrophe/release@v1.0.0
        with:
          mode: check
          pr-title: ${{ github.event.pull_request.title }}

      - uses: kohltastrophe/sert/actions/setup@v0.1.0

      - name: luaudocs llms --check
        run: npx --yes luaudocs@latest llms --check

      - name: sert lint
        run: python3 tools/sert.py lint

      - name: sert run
        run: python3 tools/sert.py run --coverage

      - name: sert coverage
        run: python3 tools/sert.py coverage --min 90 --badge

      - name: sert mutate
        if: "!startsWith(github.event.head_commit.message, 'chore: release')"
        run: python3 tools/sert.py mutate --no-coverage-run --min 85

      - name: Build the place
        run: rojo build test/default.project.json --output "$RUNNER_TEMP/sert-cloud.rbxl"

      - name: sert cloud
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID || secrets.ROBLOX_TEST_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID || secrets.ROBLOX_TEST_PLACE_ID }}
        run: python3 tools/sert.py cloud --place "$RUNNER_TEMP/sert-cloud.rbxl" --script test/spec.client.luau

      - name: Update coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/sert.py coverage --badge-branch --badge-push
